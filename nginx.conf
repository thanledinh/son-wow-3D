server {
  listen 3000;
  listen [::]:3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;

  # hashed build output never changes
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 3D models, studio HDRI, baked textures and the Draco decoder (cache-busted with ?v= in the app)
  location ~* \.(glb|wasm|hdr|jpg|png|webp)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
