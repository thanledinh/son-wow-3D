server {
  listen 3000;
  listen [::]:3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # redirects stay relative: behind Dokploy's proxy this server's own address (http, port 3000) must not leak into them
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;

  # hashed build output never changes
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 3D models, the environment HDRI, textures and the Draco decoder (cache-busted with ?v= in the app)
  location ~* \.(glb|wasm|hdr|jpg|png|webp)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # the one page lives at /; the old pages' addresses (/v2, /v3) lead there
  location ~ ^/v[23](\.html)?/?$ {
    return 301 /$is_args$args;
  }

  # the page itself is asked for again on every visit (it names the day's hashed build, so a kept copy went on
  # showing the last deploy's site)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
